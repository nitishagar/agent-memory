[licenses]
version = 2
# licenses v2: anything not allow-listed (or excepted/clarified) is denied,
# which subsumes the former explicit copyleft/SSPL deny list.
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "Unicode-3.0"]

[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
