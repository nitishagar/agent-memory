name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build -p amem-cli
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - if: runner.os != 'Windows'
        run: ./tests/e2e_phase1.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/e2e_phase2.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/export_schema.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/e2e_phase3.sh ./target/debug/amem
