name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build -p amem-cli
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - if: runner.os != 'Windows'
        run: ./tests/e2e_phase1.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/e2e_phase2.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/export_schema.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/e2e_phase3.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/tls_refusal.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/e2e_phase4.sh ./target/debug/amem
      - if: runner.os != 'Windows'
        run: ./tests/install_smoke.sh ./target/debug/amem
      - if: runner.os == 'Linux'
        run: ./tests/docs_smoke.sh ./target/debug/amem

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: structured fuzz (60s per target)
        run: |
          cargo test -p amem-core --test fuzz_targets -- --nocapture \
            FUZZ_SECS=60 FUZZ_SEED=20261030 2>&1 | tail -5
